# Deploys the web app (app/) to Cloudflare Pages project caravel-repo (https://caravel-repo.pages.dev)
# on every push to main that touches the app, the design system, the bindings or the deployment ids.
# Uses the same two repo secrets as site.yml (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID); skipped until they exist.
# Public build only: build:public forces the demo signer off and runs check-no-secrets.
name: Deploy app
on:
  push:
    branches: [main]
    paths: ["app/**", "design/**", "packages/**", "deployments/**", ".github/workflows/app.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
      - name: Install (builds the contract bindings in packages/)
        if: env.HAS_TOKEN == 'true'
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Public build + secret check
        if: env.HAS_TOKEN == 'true'
        working-directory: app
        run: npm run build:public
      - name: Deploy app/dist to Cloudflare Pages (project caravel-repo)
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name caravel-repo --branch main --commit-dirty=true
      - name: Skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN is not set; add it to deploy the app (see the comment at the top of this file)."
