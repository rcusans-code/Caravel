[package]
name = "caravel-repo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# Mainnet build (Raven R12, UA-07): timelock floor 1 day, instance TTL 30 days.
# `stellar contract build --package caravel-repo --features production`.
# The default build (testnet, demo) is unchanged.
production = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
caravel-spiko-mock = { path = "../spiko-mock" }
caravel-oracle = { path = "../oracle" }
