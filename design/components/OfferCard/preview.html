<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title><style>body{padding:16px;}</style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:640px">
<article class="cv-card">
  <div class="cv-card__head"><span class="cv-eyebrow">Offer #014</span><span class="cv-pill cv-pill--open">Open</span></div>
  <div><span class="cv-figure-xl">1,000.00</span><span class="cv-unit">USDC</span></div>
  <div class="cv-apr">5.20% APR<span class="cv-unit">fixed</span></div>
  <dl class="cv-terms"><div><dt>Term</dt><dd>7 days</dd></div><div><dt>Haircut</dt><dd>3.0%</dd></div><div><dt>Collateral</dt><dd>tBENJI</dd></div></dl>
  <button class="cv-btn cv-btn--primary" type="button">Take offer</button>
</article>
<article class="cv-card cv-card--featured">
  <div class="cv-card__head"><span class="cv-eyebrow">Offer #015</span><span class="cv-pill cv-pill--featured">Featured</span></div>
  <div><span class="cv-figure-xl">25,000.00</span><span class="cv-unit">USDC</span></div>
  <div class="cv-apr">4.85% APR<span class="cv-unit">fixed</span></div>
  <dl class="cv-terms"><div><dt>Term</dt><dd>14 days</dd></div><div><dt>Haircut</dt><dd>3.0%</dd></div><div><dt>Collateral</dt><dd>USDY</dd></div></dl>
  <button class="cv-btn cv-btn--secondary" type="button">Take offer</button>
</article>
</div>
<script>/* static preview */</script>
</body>
</html>
