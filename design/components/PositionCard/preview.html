<!-- @dsCard group="Lending" height=300 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title><style>body{padding:16px;}</style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:640px">
<article class="cv-card">
  <div class="cv-card__head"><span class="cv-eyebrow">Repo #014 · borrowed</span><span class="cv-pill cv-pill--open">Open</span></div>
  <div><span class="cv-figure-xl">970.00</span><span class="cv-unit">USDC</span></div>
  <div class="cv-health"><div class="cv-health__legend"><span>Collateral cover</span><span class="cv-num">103.1%</span></div>
    <div class="cv-health__bar" role="meter" aria-valuemin="90" aria-valuemax="110" aria-valuenow="103.1" aria-label="Collateral cover"><div class="cv-health__fill" style="width:65%"></div><div class="cv-health__mark" style="left:50%"></div></div>
    <div class="cv-health__legend"><span>Margin call at 100%</span><span>NAV 1.0004</span></div></div>
  <div class="cv-row" style="justify-content:space-between"><span class="cv-countdown"><span class="cv-field__hint">Matures in</span><span class="cv-countdown__time">4d 06:12:40</span></span><button class="cv-btn cv-btn--primary cv-btn--sm" type="button">Repay</button></div>
</article>
<article class="cv-card">
  <div class="cv-card__head"><span class="cv-eyebrow">Repo #016 · borrowed</span><span class="cv-pill cv-pill--margin">Margin call</span></div>
  <div><span class="cv-figure-xl">970.00</span><span class="cv-unit">USDC</span></div>
  <div class="cv-health cv-health--margin"><div class="cv-health__legend"><span>Collateral cover</span><span class="cv-num">98.6%</span></div>
    <div class="cv-health__bar" role="meter" aria-valuemin="90" aria-valuemax="110" aria-valuenow="98.6" aria-label="Collateral cover"><div class="cv-health__fill" style="width:43%"></div><div class="cv-health__mark" style="left:50%"></div></div>
    <div class="cv-health__legend"><span>Margin call at 100%</span><span>NAV 0.9958</span></div></div>
  <div class="cv-row" style="justify-content:space-between"><span class="cv-countdown"><span class="cv-field__hint">Top up within</span><span class="cv-countdown__time">01:47</span></span><button class="cv-btn cv-btn--primary cv-btn--sm" type="button">Top up</button></div>
</article>
</div>
<script>/* static preview */</script>
</body>
</html>
